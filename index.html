<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Best Things</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Best Things</h1>
    <p>Which do you like better? Click one.</p>
  </header>

  <main class="matchup">
    <button id="left" class="thing"></button>
    <span class="vs">vs</span>
    <button id="right" class="thing"></button>
  </main>

  <section class="results">
    <h2>Leaderboard</h2>
    <ol id="leaderboard"></ol>
  </section>

  <!-- Load the data first, then the logic that uses it. Order matters here. -->
  <script src="js/things.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
